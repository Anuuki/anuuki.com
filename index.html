<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>ANUUKI.COM – Coming Soon</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        :root {
            --primary-color: #1f6fd1;
            --text-color: #ffffff;
            --body-font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: var(--body-font);
            background-image: url("anuuki.jpg");
            background-repeat: repeat;
            background-size: 120px; /* adjust tile size */
            background-position: center;
        }

        .card {
            max-width: 640px;
            width: 90%;
            background: var(--primary-color);
            color: var(--text-color);
            padding: 40px 32px;
            border-radius: 12px;
            box-shadow: 0 18px 40px rgba(0, 0, 0, 0.18);
            text-align: center;
        }

        .logo {
            font-size: 2rem;
            letter-spacing: 0.12em;
            font-weight: 700;
            margin-bottom: 12px;
        }

        .subtitle {
            font-size: 1.1rem;
            margin-bottom: 24px;
        }

        .legal {
            font-size: 0.85rem;
            line-height: 1.5;
            margin-bottom: 24px;
            opacity: 0.9;
        }

        .footer-links {
            font-size: 0.9rem;
        }

        .footer-links a {
            color: var(--text-color);
            text-decoration: none;
            border-bottom: 1px solid rgba(255, 255, 255, 0.4);
            padding-bottom: 2px;
            margin: 0 6px;
        }

        .footer-links a:hover {
            border-bottom-color: #ffffff;
        }
    </style>
</head>
<body>
    <main class="card" role="main">
        <div class="logo">ANUUKI.COM</div>
        <div class="subtitle">Coming soon.</div>

        <p class="legal">
            © 2025 ANUUKI.COM. All rights reserved.<br>
            All content on this site is the property of ANUUKI.COM and may not be reproduced or used without permission.<br>
            This is a temporary placeholder page.
        </p>

        <div class="footer-links">
            <a href="#privacy">Privacy Policy</a> |
            <a href="#terms">Terms of Use</a>
        </div>
    </main>
</body>
</html>
