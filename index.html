<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <title>annuki.com</title>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        height: 100%;
      }
      body {
        background-image: url("anuuki.jpg");
        background-repeat: repeat;
        background-size: 200px 200px;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
        font-family: system-ui, -apple-system, sans-serif;
      }
      .overlay {
        background: rgba(0, 0, 0, 0.6);
        color: #fff;
        padding: 40px 60px;
        border-radius: 16px;
      }
      .overlay h1 {
        margin: 0 0 10px;
        letter-spacing: 0.15em;
        text-transform: uppercase;
        font-size: 28px;
      }
      .overlay p {
        margin: 0;
        font-size: 18px;
        opacity: 0.85;
      }
    </style>
  </head>
  <body>
    <div class="overlay">
      <h1>annuki.com</h1>
      <p>Coming soon.</p>
    </div>
  </body>
</html>
